# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: combsmith/.github/standards/workflows/sonarcloud.yml
# Standard:        combsmith/.github/standards/ci-standards.md#3-sonarcloud-analysis
#
# ADOPTING THIS WORKFLOW:
#   1. This ships verbatim into repos created from combsmith/repo-template.
#   2. Set sonar.projectKey / sonar.organization in sonar-project.properties to
#      match your repo (see BOOTSTRAP.md), and add the SONAR_TOKEN repo secret.
#   3. The job name `SonarCloud` is the required status check — keep it.
#   4. Without SONAR_TOKEN the job cannot analyse. The `Check SonarCloud token`
#      gate decides what that means for the required check:
#        • SONAR_BOOTSTRAP repo variable = "true" → green no-op (explicit
#          bootstrap; delete the variable once SonarCloud is onboarded)
#        • fork pull request (secrets are never passed to forks) → FAIL, so an
#          unanalysed fork change can't pass the required check
#        • same-repo run (push, same-repo PR) → green no-op with a warning: the
#          repo has no token yet, so a fresh repo is not blocked on day 0
#
# CONVENTIONS (enforced by the standard):
#   • permissions: {} at top, least-privilege per job (contents + pull-requests: read)
#   • triggers: push + pull_request to main; checkout with fetch-depth: 0
#   • SONAR_TOKEN is scoped to the gate and scan steps ONLY — never job- or
#     workflow-level `env:`. A step that builds or tests the checked-out code
#     must not see it; generate coverage in a separate job without secrets and
#     hand the report over as an artifact.
#   • on pull_request the scan waits for the quality gate
#     (-Dsonar.qualitygate.wait=true), so a failed gate fails the required check
#   • first scan is continue-on-error with a single retry, taken only when no
#     analysis was uploaded (the scanner CLI download is occasionally flaky);
#     a gate failure is never retried, and a final step fails the job on it
#   • SHA-pin every third-party action (never a tag/branch)
# ─────────────────────────────────────────────────────────────────────────────
name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        id: setup_java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # The required check must not pass a fork PR just because the token is
      # unavailable to it. Outputs present=true|false; fails on a fork PR
      # without the token unless SONAR_BOOTSTRAP is "true". Never echoes the token.
      - name: Check SonarCloud token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BOOTSTRAP: ${{ vars.SONAR_BOOTSTRAP }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [ "${SONAR_BOOTSTRAP:-}" = "true" ]; then
            echo "::notice title=SonarCloud skipped::SONAR_BOOTSTRAP is 'true' and SONAR_TOKEN is unavailable, so no analysis ran. Delete the SONAR_BOOTSTRAP variable once SonarCloud is onboarded."
            exit 0
          fi
          if [ "${EVENT_NAME:-}" = "pull_request" ] && [ "${HEAD_REPO:-}" != "${BASE_REPO:-}" ]; then
            msg="This pull request comes from a fork. GitHub does not pass SONAR_TOKEN to fork runs,"
            msg="${msg} so SonarCloud cannot analyse it and this required check fails."
            msg="${msg} A maintainer can push the branch to this repository and open a same-repo"
            msg="${msg} pull request so the analysis runs (combsmith/.github standards/ci-standards.md, section 3)."
            echo "::error title=SonarCloud not run::${msg}"
            exit 1
          fi
          msg="SONAR_TOKEN is not available to this run, so no analysis ran. Add the SONAR_TOKEN secret"
          msg="${msg} (see BOOTSTRAP.md); Dependabot runs only see it if it is also a Dependabot secret."
          echo "::warning title=SonarCloud skipped::${msg}"
      # The scan waits for the SonarCloud quality gate on pull requests
      # (sonar.qualitygate.wait), so a failed gate fails this job and the
      # required `SonarCloud` check. push runs do not wait: the gate was
      # enforced on the PR, and a main-branch verdict would only fail
      # post-merge runs.
      # First attempt. continue-on-error lets the retry step below recover from
      # transient 403/5xx responses from binaries.sonarsource.com (the scanner
      # CLI download), without failing the job on a single CDN blip.
      - name: SonarCloud Scan
        id: sonar
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true' || '' }}
        continue-on-error: true
      # Retry only when no analysis reached SonarCloud. The scanner writes
      # .scannerwork/report-task.txt once the upload succeeds, before it polls
      # the gate, so its presence means the first attempt failed on the gate,
      # not on a transient download error.
      - name: SonarCloud Scan (retry)
        id: sonar_retry
        if: steps.token.outputs.present == 'true' && steps.sonar.outcome == 'failure' && hashFiles('.scannerwork/report-task.txt') == ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true' || '' }}
      # continue-on-error keeps a failed first attempt from failing the job, so
      # a gate failure that skipped the retry has to fail the job here.
      - name: Fail on SonarCloud quality gate
        if: steps.token.outputs.present == 'true' && steps.sonar.outcome == 'failure' && steps.sonar_retry.outcome == 'skipped'
        run: |
          msg="The analysis was uploaded but the quality gate failed or did not "
          msg="${msg}finish. See the SonarCloud Scan step log and the 'SonarCloud "
          msg="${msg}Code Analysis' check for details."
          echo "::error title=SonarCloud quality gate::${msg}"
          exit 1

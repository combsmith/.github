# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: combsmith/.github/standards/workflows/sonarcloud.yml
# Standard:        combsmith/.github/standards/ci-standards.md#3-sonarcloud-analysis
#
# ADOPTING THIS WORKFLOW:
#   1. This ships verbatim into repos created from combsmith/repo-template.
#   2. Set sonar.projectKey / sonar.organization in sonar-project.properties to
#      match your repo (see BOOTSTRAP.md), and add the SONAR_TOKEN repo secret.
#   3. The job name `SonarCloud` is the required status check — keep it.
#   4. The scan is guarded on SONAR_TOKEN, so the job is a green no-op until the
#      secret is set — a fresh repo is not blocked on day 0.
#
# CONVENTIONS (enforced by the standard):
#   • permissions: {} at top, least-privilege per job (contents + pull-requests: read)
#   • triggers: push + pull_request to main; checkout with fetch-depth: 0
#   • on pull_request the scan waits for the quality gate
#     (-Dsonar.qualitygate.wait=true), so a failed gate fails the required check
#   • first scan is continue-on-error with a single retry, taken only when no
#     analysis was uploaded (the scanner CLI download is occasionally flaky);
#     a gate failure is never retried, and a final step fails the job on it
#   • SHA-pin every third-party action (never a tag/branch)
# ─────────────────────────────────────────────────────────────────────────────
name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        id: setup_java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # The scan waits for the SonarCloud quality gate on pull requests
      # (sonar.qualitygate.wait), so a failed gate fails this job and the
      # required `SonarCloud` check. push runs do not wait: the gate was
      # enforced on the PR, and a main-branch verdict would only fail
      # post-merge runs.
      - name: SonarCloud Scan
        id: sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true' || '' }}
        continue-on-error: true
      # Retry only when no analysis reached SonarCloud. The scanner writes
      # .scannerwork/report-task.txt once the upload succeeds, before it polls
      # the gate, so its presence means the first attempt failed on the gate,
      # not on a transient download error.
      - name: SonarCloud Scan (retry)
        id: sonar_retry
        if: env.SONAR_TOKEN != '' && steps.sonar.outcome == 'failure' && hashFiles('.scannerwork/report-task.txt') == ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true' || '' }}
      # continue-on-error keeps a failed first attempt from failing the job, so
      # a gate failure that skipped the retry has to fail the job here.
      - name: Fail on SonarCloud quality gate
        if: env.SONAR_TOKEN != '' && steps.sonar.outcome == 'failure' && steps.sonar_retry.outcome == 'skipped'
        run: |
          msg="The analysis was uploaded but the quality gate failed or did not "
          msg="${msg}finish. See the SonarCloud Scan step log and the 'SonarCloud "
          msg="${msg}Code Analysis' check for details."
          echo "::error title=SonarCloud quality gate::${msg}"
          exit 1

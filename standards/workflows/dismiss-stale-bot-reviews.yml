# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: combsmith/.github/standards/workflows/dismiss-stale-bot-reviews.yml
# Standard:        combsmith/.github/standards/ci-standards.md
# Tested source:   combsmith/.github/scripts/dismiss-stale-bot-reviews.sh
#                  combsmith/.github/scripts/lib/dismiss-stale-bot-reviews.sh
#
# AGENTS — READ BEFORE EDITING:
#   • This file is a SELF-CONTAINED verbatim stub (the initiative-driver class),
#     NOT a thin caller for a reusable. A bot's CHANGES_REQUESTED review is NOT
#     cleared by GitHub's dismiss_stale_reviews_on_push (that only dismisses stale
#     *approvals*), so it persists on a superseded commit and blocks reviewDecision
#     forever (#617 blocker 3). This workflow dismisses such reviews once a NEWER
#     commit has been pushed.
#   • The two scripts are INLINED below as quoted heredocs, byte for byte, and run
#     from $RUNNER_TEMP — there is no checkout and no tag to depend on, so this one
#     file is self-sufficient. The tested source is the two scripts named above;
#     test/workflows/dismiss-stale-bot-reviews/inline-stub.bats fails if either
#     heredoc differs from its script. Edit the scripts, then regenerate the
#     heredocs — never edit them here.
#   • Triggers: `pull_request` synchronize + `pull_request_review` submitted react
#     to a push / late review on one PR. `schedule` (every 4 hours) and
#     `workflow_dispatch` run a SWEEP over every open PR whose reviewDecision is
#     CHANGES_REQUESTED, because a PR that gets no push and no new review never
#     fires the PR events (combsmith/.github-private#2570). workflow_dispatch takes
#     a `dry_run` input to preview.
#   • Guard: the two PR events run for same-repo, non-Dependabot PRs only (a fork
#     or Dependabot PR event gets a read-only GITHUB_TOKEN, so the mutation would
#     fail). Those PRs are covered by the timed sweep, which runs with a writable
#     token. The job-level `permissions:` block (pull-requests: write) is required
#     to dismiss a review; removing it breaks the dismissal.
#   • BOT-ONLY by design: human reviews are never dismissed. To change the bot
#     allow-list, set the DSBR_BOT_ALLOWLIST repo/org variable (comma-separated
#     logins, with or without a `[bot]` suffix) — it REPLACES the default list.
#   • If you need different behaviour, open a PR against the scripts in
#     combsmith/.github and regenerate this file.
# ─────────────────────────────────────────────────────────────────────────────
#
# Dismiss stale bot reviews — self-contained org-standard workflow.
# To adopt: copy this file verbatim to .github/workflows/dismiss-stale-bot-reviews.yml.
# No secrets required — uses GITHUB_TOKEN only (pull-requests: write).
name: Dismiss stale bot reviews

on:
  # A new push advances the head; a bot's CHANGES_REQUESTED now sits on a
  # superseded commit and must be cleared.
  pull_request:
    types: [synchronize]
  # A bot may also submit a review on an already-superseded commit (race); the
  # decision core keeps it only when it is on the current head.
  pull_request_review:
    types: [submitted]
  # Timed sweep over all open PRs blocked by CHANGES_REQUESTED (off the hour).
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: report what would be dismissed, dismiss nothing'
        type: boolean
        default: false

permissions: {}

concurrency:
  # One lane per PR so a push burst does not fan out duplicate dismissals (the
  # latest head wins); the sweep has its own lane and is never cancelled.
  group: dismiss-stale-bot-reviews-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' }}

jobs:
  dismiss:
    # The fork/Dependabot guard applies to the two PR events only; schedule and
    # workflow_dispatch always run.
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_review')
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write   # dismissPullRequestReview via GITHUB_TOKEN
    steps:
      - name: Dismiss stale allow-listed bot reviews on superseded commits
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty for schedule/workflow_dispatch → sweep mode.
          DSBR_PR: ${{ github.event.pull_request.number }}
          # Optional wholesale override of the bot allow-list (comma-separated
          # logins). Unset → the decision core's built-in CodeRabbit/Copilot list.
          DSBR_BOT_ALLOWLIST: ${{ vars.DSBR_BOT_ALLOWLIST }}
          # Dry-run when the repo variable or the dispatch input says "true".
          DSBR_DRY_RUN: ${{ vars.DSBR_DRY_RUN }}
          DSBR_DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/dsbr/scripts"
          mkdir -p "$dir/lib"
          cat > "$dir/dismiss-stale-bot-reviews.sh" <<'DSBR_ORCHESTRATOR_EOF'
          #!/usr/bin/env bash
          # dismiss-stale-bot-reviews.sh — thin I/O glue for the dismiss-stale-bot-reviews
          # workflow (#1115). Gathers a PR's effective reviews and review threads, asks the
          # pure decision core which allow-listed bot CHANGES_REQUESTED reviews are stale
          # (on a superseded commit, with no open current thread by that bot), and dismisses
          # exactly those via the GraphQL dismissPullRequestReview mutation. All decision
          # logic lives in the sourced pure core below; this file only performs I/O.
          #
          # Usage:
          #   dismiss-stale-bot-reviews.sh --owner <owner> --name <repo> --pr <number> [--apply]
          #   dismiss-stale-bot-reviews.sh --owner <owner> --name <repo> --sweep [--apply]
          #
          # --sweep pages through ALL open PRs and runs the same decision on each PR whose
          # reviewDecision is CHANGES_REQUESTED. One PR's failure never stops the others.
          #
          # Requirements:
          #   GH_TOKEN with `pull-requests: write` on the target repo (GITHUB_TOKEN is
          #   sufficient). `gh` and `jq` on PATH.
          #
          # Failure rule: a failed read, an unreadable head, a failed or unconfirmed
          # dismissal is an error — nothing more is dismissed on that PR where the state is
          # unknown, other candidates/PRs are still processed, and the run exits non-zero at
          # the end. A head that really moved is only a warning (exit 0). Fail-closed on the
          # decision: a review whose staleness cannot be proven (missing oid) is left alone.

          set -euo pipefail

          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          # shellcheck source=scripts/lib/dismiss-stale-bot-reviews.sh
          source "${SCRIPT_DIR}/lib/dismiss-stale-bot-reviews.sh"

          OWNER="" NAME="" PR="" APPLY=false SWEEP=false

          # Retry helper: bounded retry with exponential backoff (1s, 2s; scaled by DSBR_RETRY_UNIT, default 1). Returns the exit
          # code of the command's final attempt.
          gh_api_retry() {
            local max_retries=3 attempt=1 exit_code
            while true; do
              exit_code=0
              "$@" && return 0 || exit_code=$?
              if [[ $attempt -ge $max_retries ]]; then
                return "$exit_code"
              fi
              local backoff=$(( (2 ** (attempt - 1)) * ${DSBR_RETRY_UNIT:-1} ))
              echo "::warning::gh api call failed (attempt $attempt/$max_retries); retrying in ${backoff}s…" >&2
              sleep "$backoff"
              attempt=$((attempt + 1))
            done
          }

          while [[ $# -gt 0 ]]; do
            case "$1" in
              --owner) OWNER="$2"; shift 2 ;;
              --name)  NAME="$2";  shift 2 ;;
              --pr)    PR="$2";    shift 2 ;;
              --sweep) SWEEP=true; shift ;;
              --apply) APPLY=true; shift ;;
              --dry-run) shift ;; # dry-run is the default; flag is a no-op for explicitness
              -h|--help) sed -n '2,23p' "$0" | sed 's/^# \{0,1\}//'; exit 0 ;;
              *) echo "::error::unknown argument: $1" >&2; exit 1 ;;
            esac
          done

          if [[ -z "$OWNER" ]] || [[ -z "$NAME" ]] || { [[ -z "$PR" ]] && [[ "$SWEEP" != "true" ]]; }; then
            echo "::error::--owner, --name and one of --pr or --sweep are required" >&2
            exit 1
          fi
          if [[ -n "$PR" ]] && [[ "$SWEEP" = "true" ]]; then
            echo "::error::--pr and --sweep are mutually exclusive" >&2
            exit 1
          fi

          # EFFECTIVE, OPINIONATED (latest-per-reviewer) reviews — the set GitHub uses to
          # compute reviewDecision. latestOpinionatedReviews, NOT latestReviews: a trailing
          # COMMENTED review would otherwise mask a still-blocking CHANGES_REQUESTED (#1116).
          # Paginated (100 per page) so a stale bot review past the first page is not dropped.
          read -r -d '' REVIEWS_QUERY <<'GRAPHQL' || true
          query($owner:String!, $name:String!, $number:Int!, $cursor:String) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                headRefOid
                latestOpinionatedReviews(first: 100, after: $cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    id
                    state
                    commit { oid }
                    author { login __typename }
                  }
                }
              }
            }
          }
          GRAPHQL

          # Review threads: a bot's review is kept while that bot has a thread that is
          # unresolved and not outdated. Paginated like the reviews.
          read -r -d '' THREADS_QUERY <<'GRAPHQL' || true
          query($owner:String!, $name:String!, $number:Int!, $cursor:String) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                reviewThreads(first: 100, after: $cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isResolved
                    isOutdated
                    comments(first: 1) { nodes { author { login } } }
                  }
                }
              }
            }
          }
          GRAPHQL

          # shellcheck disable=SC2016  # GraphQL variables, not shell expansions
          HEAD_QUERY='query($owner:String!, $name:String!, $number:Int!) {
            repository(owner:$owner, name:$name) { pullRequest(number:$number) { headRefOid } }
          }'

          # shellcheck disable=SC2016  # GraphQL variables, not shell expansions
          SWEEP_QUERY='query($owner:String!, $name:String!, $cursor:String) {
            repository(owner:$owner, name:$name) {
              pullRequests(states: OPEN, first: 100, after: $cursor) {
                pageInfo { hasNextPage endCursor }
                nodes { number reviewDecision }
              }
            }
          }'

          # gql_errors <response> — 0 when the response carries a GraphQL errors envelope
          # (HTTP 200 can carry partial data plus errors).
          gql_errors() {
            jq -e '(.errors // []) | length > 0' <<<"$1" >/dev/null 2>&1
          }

          # next_cursor <response> <jq-path-to-connection> <current_cursor> — advance a
          # pagination loop. Prints the next cursor and returns 0 to continue; returns 1 when
          # there is no further page; returns 2 on an invalid continuation (hasNextPage with
          # an empty or non-advancing cursor), which would loop forever or truncate results.
          next_cursor() {
            local response="$1" path="$2" current="$3" has_next end_cursor
            has_next="$(jq -r "${path}.pageInfo.hasNextPage // false" <<<"$response")"
            [[ "$has_next" = "true" ]] || return 1
            end_cursor="$(jq -r "${path}.pageInfo.endCursor // \"\"" <<<"$response")"
            if [[ -z "$end_cursor" ]] || [[ "$end_cursor" = "$current" ]]; then
              return 2
            fi
            printf '%s' "$end_cursor"
          }

          # gql_page <query> <cursor> [extra gh args…] — one paginated GraphQL call. owner and
          # name are raw strings (-f); number must be -F so it resolves to Int!.
          gql_page() {
            local query="$1" cursor="$2"; shift 2
            local -a cursor_arg
            if [[ -z "$cursor" ]]; then cursor_arg=(-F cursor=null); else cursor_arg=(-f "cursor=$cursor"); fi
            gh_api_retry gh api graphql -f query="$query" "${cursor_arg[@]}" -f owner="$OWNER" -f name="$NAME" "$@"
          }

          # process_pr <number> — returns 0 (handled, incl. nothing to do / head moved) or 1
          # (an error occurred; the caller exits non-zero at the end).
          process_pr() {
            local pr="$1" tag="${OWNER}/${NAME}#${1}"
            local head_oid="" reviews="" threads="" cursor="" first=true response page next rc

            # ---- reviews (paged) ----
            while true; do
              response="$(gql_page "$REVIEWS_QUERY" "$cursor" -F number="$pr")" || {
                echo "::error::could not read reviews for ${tag}" >&2; return 1; }
              if gql_errors "$response"; then
                echo "::error::GraphQL error while fetching reviews for ${tag}: $(jq -r '.errors[0].message // "unknown error"' <<<"$response")" >&2
                return 1
              fi
              if [[ "$first" = "true" ]]; then
                head_oid="$(jq -r '.data.repository.pullRequest.headRefOid // ""' <<<"$response")"
                if [[ -z "$head_oid" ]]; then
                  echo "::warning::could not resolve head oid for ${tag} (PR not found or not accessible); nothing to do"
                  return 0
                fi
                first=false
              fi
              page="$(jq -r '
                .data.repository.pullRequest.latestOpinionatedReviews.nodes[]
                | [ .id, .state, (.commit.oid // ""), (.author.login // ""), (.author.__typename // "") ]
                | @tsv
              ' <<<"$response")" || { echo "::error::malformed reviews response for ${tag}" >&2; return 1; }
              [[ -n "$page" ]] && reviews+="${page}"$'\n'
              rc=0
              next="$(next_cursor "$response" '.data.repository.pullRequest.latestOpinionatedReviews' "$cursor")" || rc=$?
              if [[ "$rc" -eq 2 ]]; then
                echo "::error::invalid reviews pagination continuation for ${tag} (empty or non-advancing cursor)" >&2
                return 1
              fi
              [[ "$rc" -eq 0 ]] || break
              cursor="$next"
            done

            # ---- review threads (paged); unreadable => dismiss nothing on this PR ----
            cursor=""
            while true; do
              response="$(gql_page "$THREADS_QUERY" "$cursor" -F number="$pr")" || {
                echo "::error::could not read review threads for ${tag}; dismissing nothing" >&2; return 1; }
              if gql_errors "$response"; then
                echo "::error::GraphQL error while fetching review threads for ${tag}: $(jq -r '.errors[0].message // "unknown error"' <<<"$response"); dismissing nothing" >&2
                return 1
              fi
              page="$(jq -r '
                .data.repository.pullRequest.reviewThreads.nodes[]
                | [ (.isResolved | tostring), (.isOutdated | tostring), (.comments.nodes[0].author.login // "") ]
                | @tsv
              ' <<<"$response")" || { echo "::error::malformed review-threads response for ${tag}; dismissing nothing" >&2; return 1; }
              [[ -n "$page" ]] && threads+="${page}"$'\n'
              rc=0
              next="$(next_cursor "$response" '.data.repository.pullRequest.reviewThreads' "$cursor")" || rc=$?
              if [[ "$rc" -eq 2 ]]; then
                echo "::error::invalid review-threads pagination continuation for ${tag} (empty or non-advancing cursor); dismissing nothing" >&2
                return 1
              fi
              [[ "$rc" -eq 0 ]] || break
              cursor="$next"
            done

            # recheck_head <expected> — 0 same head, 1 head moved (warned), 2 unreadable.
            recheck_head() {
              local resp live
              resp="$(gh_api_retry gh api graphql -f query="$HEAD_QUERY" \
                -f owner="$OWNER" -f name="$NAME" -F number="$pr")" || {
                echo "::error::could not re-read the head for ${tag}" >&2; return 2; }
              if gql_errors "$resp"; then
                echo "::error::GraphQL error while rechecking head oid for ${tag}: $(jq -r '.errors[0].message // "unknown error"' <<<"$resp")" >&2
                return 2
              fi
              live="$(jq -r '.data.repository.pullRequest.headRefOid // ""' <<<"$resp")"
              [[ -n "$live" ]] || { echo "::error::head oid for ${tag} is unreadable on recheck" >&2; return 2; }
              if [[ "$live" != "$1" ]]; then
                echo "::warning::PR head moved from ${1} to ${live} for ${tag}; skipping remaining dismissals to avoid clearing a review on the new head"
                return 1
              fi
              return 0
            }

            # Revalidate the head before applying anything (it can move between the read and
            # the mutations, e.g. a force-push restoring a previously reviewed commit).
            rc=0; recheck_head "$head_oid" || rc=$?
            [[ "$rc" -eq 0 ]] || { [[ "$rc" -eq 1 ]] && return 0 || return 1; }

            local dismissed=0 would_dismiss=0 examined=0 failed=0
            local review_id state commit_oid login author_type msg mutation_resp new_state
            while IFS=$'\t' read -r review_id state commit_oid login author_type; do
              [[ -n "$review_id" ]] || continue
              examined=$((examined + 1))
              dsbr_should_dismiss "$state" "$commit_oid" "$head_oid" "$login" "$author_type" "" "$threads" || continue

              # Revalidate before each mutation. An unreadable head is a FAILURE of this PR
              # (stop mutating, exit non-zero); a head that really moved is a warning.
              rc=0; recheck_head "$head_oid" || rc=$?
              if [[ "$rc" -eq 1 ]]; then return 0; fi
              if [[ "$rc" -ne 0 ]]; then return 1; fi

              msg="Superseded: dismissed by dismiss-stale-bot-reviews because ${login}'s CHANGES_REQUESTED review was on ${commit_oid} but the PR head is now ${head_oid}."
              msg+=" A still-valid finding returns as a fresh review on the new commit."
              if [[ "$APPLY" != "true" ]]; then
                echo "[dry-run] would dismiss review ${review_id} by ${login} (on ${commit_oid}, head ${head_oid})"
                would_dismiss=$((would_dismiss + 1))
                continue
              fi
              # Real `gh api graphql` exits non-zero on an errors envelope; tolerate that, log
              # an ::error:: naming the review, keep going, and fail the run at the end.
              # shellcheck disable=SC2016  # GraphQL variables, not shell expansions
              if ! mutation_resp="$(gh_api_retry gh api graphql \
                -f query='mutation($id:ID!, $msg:String!) {
                  dismissPullRequestReview(input:{pullRequestReviewId:$id, message:$msg}) {
                    pullRequestReview { id state }
                  }
                }' \
                -f id="$review_id" -f msg="$msg")"; then
                echo "::error::dismissal of review ${review_id} by ${login} on ${tag} failed; leaving it in place" >&2
                failed=$((failed + 1))
                continue
              fi
              if gql_errors "$mutation_resp"; then
                echo "::error::dismissal of review ${review_id} by ${login} on ${tag} returned a GraphQL errors envelope; leaving it in place" >&2
                failed=$((failed + 1))
                continue
              fi
              new_state="$(jq -r '.data.dismissPullRequestReview.pullRequestReview.state // ""' <<<"$mutation_resp")"
              if [[ "$new_state" != "DISMISSED" ]]; then
                echo "::error::dismissal of review ${review_id} by ${login} on ${tag} was not confirmed (state='${new_state:-<none>}'); leaving it in place" >&2
                failed=$((failed + 1))
                continue
              fi
              echo "Dismissed stale review ${review_id} by ${login} (was on ${commit_oid}, head ${head_oid})"
              dismissed=$((dismissed + 1))
            done <<<"$reviews"

            if [[ "$APPLY" != "true" ]]; then
              summary="dismiss-stale-bot-reviews [dry-run]: examined ${examined} effective review(s), would dismiss ${would_dismiss} stale bot review(s)"
              echo "${summary} on ${tag} (head ${head_oid}); no reviews were dismissed"
            else
              echo "dismiss-stale-bot-reviews: examined ${examined} effective review(s), dismissed ${dismissed} stale bot review(s) on ${tag} (head ${head_oid})"
            fi
            [[ "$failed" -eq 0 ]]
          }

          # sweep — page through every open PR and process those blocked by CHANGES_REQUESTED.
          sweep() {
            local cursor="" response page next rc number checked=0 blocked=0 failed=0
            local -a numbers=()
            while true; do
              response="$(gql_page "$SWEEP_QUERY" "$cursor")" || {
                echo "::error::could not list open PRs for ${OWNER}/${NAME}" >&2; return 1; }
              if gql_errors "$response"; then
                echo "::error::GraphQL error while listing open PRs for ${OWNER}/${NAME}: $(jq -r '.errors[0].message // "unknown error"' <<<"$response")" >&2
                return 1
              fi
              page="$(jq -r '
                .data.repository.pullRequests.nodes[]
                | [ (.number | tostring), (.reviewDecision // "") ] | @tsv
              ' <<<"$response")" || { echo "::error::malformed PR list response" >&2; return 1; }
              while IFS=$'\t' read -r number state; do
                [[ -n "$number" ]] || continue
                checked=$((checked + 1))
                if [[ "$state" = "CHANGES_REQUESTED" ]]; then numbers+=("$number"); blocked=$((blocked + 1)); fi
              done <<<"$page"
              rc=0
              next="$(next_cursor "$response" '.data.repository.pullRequests' "$cursor")" || rc=$?
              if [[ "$rc" -eq 2 ]]; then
                echo "::error::invalid PR-list pagination continuation (empty or non-advancing cursor)" >&2
                return 1
              fi
              [[ "$rc" -eq 0 ]] || break
              cursor="$next"
            done

            for number in "${numbers[@]+"${numbers[@]}"}"; do
              if ! process_pr "$number"; then
                echo "::error::sweep: ${OWNER}/${NAME}#${number} failed; continuing with the remaining PRs" >&2
                failed=$((failed + 1))
              fi
            done
            echo "dismiss-stale-bot-reviews sweep: checked ${checked} open PR(s), ${blocked} blocked by CHANGES_REQUESTED, ${failed} failed on ${OWNER}/${NAME}"
            [[ "$failed" -eq 0 ]]
          }

          if [[ "$SWEEP" = "true" ]]; then
            sweep
          else
            process_pr "$PR"
          fi
          DSBR_ORCHESTRATOR_EOF
          cat > "$dir/lib/dismiss-stale-bot-reviews.sh" <<'DSBR_CORE_EOF'
          #!/usr/bin/env bash
          # dismiss-stale-bot-reviews.sh (lib) — PURE decision core for the
          # dismiss-stale-bot-reviews workflow (#1115).
          #
          # Why this exists:
          #   Agent-PR merge friction (#617, blocker 3): a bot's CHANGES_REQUESTED review is
          #   NOT cleared by GitHub's dismiss_stale_reviews_on_push (that only dismisses
          #   stale *approvals*), so it persists on a superseded commit and blocks
          #   reviewDecision even with 0 unresolved threads — until the bot re-APPROVEs or a
          #   human dismisses it by hand. This core decides which reviews a workflow may
          #   dismiss on its behalf.
          #
          # This file is side-effect-free and network-free so it can be unit-tested with
          # bats (see test/workflows/dismiss-stale-bot-reviews/decision.bats). The
          # orchestrator (scripts/dismiss-stale-bot-reviews.sh) sources it and acts on the
          # verdict; the workflow is thin I/O glue.
          #
          # Decision contract: dismiss a review ONLY when ALL of the following hold —
          #   1. its state is CHANGES_REQUESTED (an APPROVED/COMMENTED review never blocks);
          #   2. its author is an allow-listed BOT (bot-only by design — human reviews are
          #      never dismissed, #1115 out-of-scope);
          #   3. it sits on a commit that is NO LONGER the PR head (superseded). A still-
          #      valid finding on the current head is left in place; it returns as a fresh
          #      CHANGES_REQUESTED on the new SHA when a bot re-reviews;
          #   4. that same bot has NO review thread that is still open and current
          #      (isResolved == false AND isOutdated == false, started by the same login,
          #      compared after `[bot]` normalization). A bot's live finding on the current
          #      head must not be dismissed along with its review (.github-private#2570).

          # Default allow-list of bot review authors whose stale CHANGES_REQUESTED reviews
          # may be dismissed. Matches the AI code reviewers this org runs (CodeRabbit +
          # Copilot). Override wholesale via DSBR_BOT_ALLOWLIST (comma-separated logins) or
          # the optional CSV argument to the predicates below — an explicit list REPLACES
          # this default so an operator has full, tight control over what may be dismissed.
          #
          # The defaults are the GraphQL login form (no `[bot]` suffix): the orchestrator
          # reads `author.login` over GraphQL, which returns `coderabbitai`, not the REST
          # `coderabbitai[bot]`. Matching normalizes one trailing `[bot]` on both sides, so
          # an operator list may use either form.
          DSBR_DEFAULT_ALLOWLIST=(
            "coderabbitai"
            "copilot-pull-request-reviewer"
          )

          # dsbr_norm_login <login> — strip ONE trailing `[bot]` so the GraphQL and REST
          # forms of a bot login compare equal.
          dsbr_norm_login() {
            printf '%s' "${1%\[bot\]}"
          }

          # dsbr_resolve_allowlist [csv] — print the active allow-list, one login per line.
          # Precedence: explicit CSV arg > DSBR_BOT_ALLOWLIST env > built-in default. A
          # supplied list REPLACES the default. Entries are whitespace-trimmed so
          # "a[bot], b[bot]" resolves to "a[bot]" and "b[bot]", not "a[bot]" and " b[bot]".
          dsbr_resolve_allowlist() {
            local csv="${1:-${DSBR_BOT_ALLOWLIST:-}}"
            if [[ -z "$csv" ]]; then
              printf '%s\n' "${DSBR_DEFAULT_ALLOWLIST[@]}"
              return 0
            fi
            # Split on commas without pathname-globbing (read -a, not unquoted expansion).
            local entries=() entry
            IFS=',' read -r -a entries <<<"$csv"
            for entry in "${entries[@]}"; do
              entry="${entry#"${entry%%[![:space:]]*}"}"   # strip leading whitespace
              entry="${entry%"${entry##*[![:space:]]}"}"   # strip trailing whitespace
              [[ -n "$entry" ]] && printf '%s\n' "$entry"
            done
          }

          # dsbr_is_allowlisted_bot <login> <author_type> [allowlist_csv]
          #   0 if the review author is an allow-listed BOT, non-zero otherwise.
          #   The author_type (GraphQL review author __typename) MUST be "Bot": this is the
          #   bot-only gate that guarantees a human review is never a dismissal candidate,
          #   even if a human login were mistakenly present in the allow-list.
          dsbr_is_allowlisted_bot() {
            local login="$1" author_type="$2" csv="${3:-}"
            [[ "$author_type" = "Bot" ]] || return 1
            # Pre-parse the resolved allow-list once into a local associative array so the
            # membership test is a native in-process lookup rather than a per-entry string
            # compare. All loop-scoped names are declared local so nothing leaks to global
            # scope when this is sourced.
            local -A allowed_bots=()
            local allowed
            while IFS= read -r allowed; do
              allowed_bots["$(dsbr_norm_login "$allowed")"]=1
            done < <(dsbr_resolve_allowlist "$csv")
            login="$(dsbr_norm_login "$login")"
            [[ -n "$login" ]] && [[ -n "${allowed_bots[$login]:-}" ]]
          }

          # dsbr_bot_has_open_thread <login> <threads_tsv>
          #   0 if <threads_tsv> (one TAB-separated record per review thread:
          #   isResolved, isOutdated, first-comment author login) holds a thread by the same
          #   login (after `[bot]` normalization) that is unresolved AND not outdated.
          dsbr_bot_has_open_thread() {
            local login resolved outdated author
            login="$(dsbr_norm_login "$1")"
            while IFS=$'\t' read -r resolved outdated author; do
              [[ -n "$resolved" ]] || continue
              [[ "$resolved" = "false" ]] && [[ "$outdated" = "false" ]] || continue
              [[ "$(dsbr_norm_login "$author")" = "$login" ]] && return 0
            done <<<"$2"
            return 1
          }

          # dsbr_should_dismiss <state> <review_oid> <head_oid> <login> <author_type> [allowlist_csv] [threads_tsv]
          #   0 (dismiss) iff the review is an allow-listed bot's CHANGES_REQUESTED sitting
          #   on a superseded commit AND that bot has no open, current review thread (see
          #   dsbr_bot_has_open_thread); non-zero (keep) otherwise. Fail-closed: a missing
          #   review_oid or head_oid cannot prove the review is superseded, so it is kept.
          dsbr_should_dismiss() {
            local state="$1" review_oid="$2" head_oid="$3" login="$4" author_type="$5" csv="${6:-}" threads="${7:-}"
            [[ "$state" = "CHANGES_REQUESTED" ]] || return 1
            [[ -n "$review_oid" ]] && [[ -n "$head_oid" ]] || return 1
            [[ "$review_oid" != "$head_oid" ]] || return 1
            dsbr_is_allowlisted_bot "$login" "$author_type" "$csv" || return 1
            ! dsbr_bot_has_open_thread "$login" "$threads" || return 1
            return 0
          }
          DSBR_CORE_EOF
          for f in "$dir/dismiss-stale-bot-reviews.sh" "$dir/lib/dismiss-stale-bot-reviews.sh"; do
            if [ ! -s "$f" ]; then
              echo "::error::inlined script missing or empty: $f"
              exit 1
            fi
          done
          args=(--owner "${GITHUB_REPOSITORY%%/*}" --name "${GITHUB_REPOSITORY#*/}")
          if [ -n "$DSBR_PR" ]; then
            args+=(--pr "$DSBR_PR")
          else
            args+=(--sweep)
          fi
          if [ "$DSBR_DRY_RUN" != "true" ] && [ "$DSBR_DISPATCH_DRY_RUN" != "true" ]; then
            args+=(--apply)
          fi
          bash "$dir/dismiss-stale-bot-reviews.sh" "${args[@]}"

# Quality gate for the caller-stub templates under standards/workflows/.
#
# Triggered on any PR that touches:
#   - standards/workflows/**            (a template pin changed)
#   - standards/**/*.yml, *.yaml        (workflow YAML added anywhere under standards/)
#   - .github/dependabot.yml            (Dependabot coverage of the templates changed)
#   - test/scripts/standards-templates/** (the guard itself changed)
#
# Gate: bats — every deployable template pins its major-scoped
#       `<agent>/v<M>-stable` channel and never the bare `<agent>/stable` form,
#       and Dependabot's github-actions updates cover every directory of
#       published workflow YAML (#1172).

name: Standards Templates Tests

on:
  pull_request:
    paths:
      - 'standards/workflows/**'
      # Any workflow YAML under standards/, so a NEW directory of templates still
      # runs the Dependabot coverage guard (#1172).
      - 'standards/**/*.yml'
      - 'standards/**/*.yaml'
      - '.github/dependabot.yml'
      - 'test/scripts/standards-templates/**'
      - '.github/workflows/standards-templates-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'standards/workflows/**'
      # Any workflow YAML under standards/, so a NEW directory of templates still
      # runs the Dependabot coverage guard (#1172).
      - 'standards/**/*.yml'
      - 'standards/**/*.yaml'
      - '.github/dependabot.yml'
      - 'test/scripts/standards-templates/**'
      - '.github/workflows/standards-templates-tests.yml'

permissions:
  contents: read

concurrency:
  group: standards-templates-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install bats
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats

      - name: Run bats suite
        run: bats --print-output-on-failure test/scripts/standards-templates/

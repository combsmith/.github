# Reusable AgentShield workflow — single source of truth for the org.
# Repo-level agent-shield.yml files call this to avoid duplicating
# the security scan and structural checks.
# Standard: https://github.com/combsmith/.github/blob/main/standards/agent-standards.md
#
# Two-layer approach:
#   1. ecc-agentshield CLI — deep security scan (102 rules across secrets,
#      permissions, hooks, MCP servers, and agent config)
#   2. Org-specific structural checks — required files, cross-references,
#      SKILL.md frontmatter validation
#
# Inputs let callers tune severity, the org reference string, and the set
# of required files without forking the workflow.
name: AgentShield (Reusable)

on:
  workflow_call:
    inputs:
      min-severity:
        description: "Minimum AgentShield severity to fail on (low/medium/high/critical)"
        required: false
        type: string
        default: "high"
      agentshield-version:
        description: "Pinned ecc-agentshield npm version"
        required: false
        type: string
        default: "1.4.0"
      required-files:
        description: "Newline-separated list of required agent config files"
        required: false
        type: string
        default: |
          CLAUDE.md
          GEMINI.md
          AGENTS.md
      org-standards-ref:
        description: "String AGENTS.md must reference (regex, basic grep -E)"
        required: false
        type: string
        default: 'combsmith/\.github'

permissions:
  contents: read

jobs:
  agent-shield:
    name: AgentShield
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetch the org's agent-md-xref helper for cross-repository consumers.
      # External consumers won't have scripts/lib/agent-md-xref.sh in their repo,
      # so we fetch it from combsmith/.github with sparse-checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: combsmith/.github
          path: __org-github
          sparse-checkout: scripts/lib/agent-md-xref.sh
          sparse-checkout-cone-mode: false

      # --- Deep security scan via AgentShield CLI ---
      # Uses ecc-agentshield (https://github.com/affaan-m/agentshield)
      # 102 rules: secrets, permissions, hooks, MCP servers, agent config
      - name: AgentShield Security Scan
        env:
          AS_VERSION: ${{ inputs.agentshield-version }}
          AS_SEVERITY: ${{ inputs.min-severity }}
        run: |
          npx --ignore-scripts "ecc-agentshield@${AS_VERSION}" scan \
            --path . \
            --min-severity "${AS_SEVERITY}" \
            --format terminal

      # --- Org-specific structural checks ---
      - name: Check required agent files exist
        env:
          REQUIRED_FILES: ${{ inputs.required-files }}
        run: |
          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "::error::Missing required agent file: $f"
              status=1
            fi
          done <<< "$REQUIRED_FILES"
          exit $status

      # The AGENTS.md reference verdict lives in scripts/lib/agent-md-xref.sh
      # (bats-tested; shared with the fleet compliance audit). Copy the file
      # from either the caller's repo or the org-github checkout.
      - name: Fetch cross-reference helper
        run: |
          mkdir -p "$RUNNER_TEMP/org-lib"
          if [ -f "scripts/lib/agent-md-xref.sh" ]; then
            cp "scripts/lib/agent-md-xref.sh" "$RUNNER_TEMP/org-lib/agent-md-xref.sh"
          else
            cp "__org-github/scripts/lib/agent-md-xref.sh" "$RUNNER_TEMP/org-lib/agent-md-xref.sh"
          fi

      - name: Validate cross-references
        env:
          ORG_REF: ${{ inputs.org-standards-ref }}
        run: |
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/org-lib/agent-md-xref.sh"
          status=0

          for f in CLAUDE.md GEMINI.md; do
            if [ -f "$f" ] && ! agent_md_references_agents < "$f"; then
              echo "::error file=$f::Must reference AGENTS.md"
              status=1
            fi
          done

          if [ -f "AGENTS.md" ] && \
             ! grep -qiE "$ORG_REF" AGENTS.md; then
            echo "::error file=AGENTS.md::Must reference org standards ($ORG_REF)"
            status=1
          fi

          exit $status

      - name: Validate SKILL.md frontmatter
        run: |
          status=0

          while IFS= read -r file; do
            frontmatter=$(awk \
              '/^---$/{n++; next} n==1{print} n>=2{exit}' \
              "$file")

            if [ -z "$frontmatter" ]; then
              echo "::error file=$file::Missing YAML frontmatter"
              status=1
              continue
            fi

            # Allow optional leading whitespace so indented YAML keys
            # (e.g. under a `metadata:` parent) are recognised.
            if ! echo "$frontmatter" | grep -qE '^[[:space:]]*name:'; then
              echo "::error file=$file::Missing 'name' field"
              status=1
            fi
            if ! echo "$frontmatter" | grep -qE '^[[:space:]]*description:'; then
              echo "::error file=$file::Missing 'description' field"
              status=1
            fi
          done < <(find . -name 'SKILL.md' \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*')

          if [ "$status" -eq 0 ]; then
            echo "All SKILL.md frontmatter validated."
          fi
          exit $status

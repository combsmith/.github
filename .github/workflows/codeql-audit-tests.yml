# Quality gates for the CodeQL audit script and its unit tests.
#
# Gates (all must pass before merge):
#   1. shellcheck — static analysis for the audit script
#   2. bats       — unit tests for its pure helpers (rule→family classification,
#                   suppression of alerts other audits file, severity→priority
#                   mapping, API-error classification)
name: CodeQL Audit Tests

on:
  pull_request:
    paths:
      - 'scripts/codeql-audit.sh'
      - 'scripts/lib/dev-lead-retrigger.sh'   # sourced by codeql-audit.sh
      - 'test/scripts/codeql-audit/**'
      - '.github/workflows/codeql-audit.yml'
      - '.github/workflows/codeql-audit-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/codeql-audit.sh'
      - 'scripts/lib/dev-lead-retrigger.sh'   # sourced by codeql-audit.sh
      - 'test/scripts/codeql-audit/**'
      - '.github/workflows/codeql-audit.yml'
      - '.github/workflows/codeql-audit-tests.yml'

permissions:
  contents: read

concurrency:
  group: codeql-audit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install bats, shellcheck, and jq
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats shellcheck jq

      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --severity=warning -x scripts/codeql-audit.sh scripts/lib/dev-lead-retrigger.sh

      - name: Run bats suite
        run: bats --print-output-on-failure test/scripts/codeql-audit/

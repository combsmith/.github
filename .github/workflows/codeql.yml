# ─────────────────────────────────────────────────────────────────────────────
# CodeQL — advanced setup (merge-queue exception to the org default-setup rule)
#
# WHY THIS EXISTS: the org standard is GitHub-managed CodeQL **default setup**
# (standards/ci-standards.md §2). Default setup analyzes `push` and
# `pull_request` only and cannot be given extra triggers, so it never posts a
# result on a merge queue's `gh-readonly-queue/*` ref. `CodeQL` is a required
# status check, so with default setup a merge queue could never merge anything
# (github/codeql-action#1537). This workflow adds the `merge_group` trigger and
# keeps the prior default-setup coverage: languages `actions` + `python`, the
# `default` query suite, and a weekly scheduled scan.
#
# This repo is listed in scripts/lib/codeql-advanced.sh, which is what stops
# apply-repo-settings.sh from re-enabling default setup and the compliance audit
# from flagging this file as drift. Remove the repo from that list before
# deleting this file.
#
# ⚠️ REQUIRED CUTOVER (repository setting, not a file change): code-scanning
# default setup must be DISABLED while this workflow exists. GitHub rejects the
# advanced-setup upload while default setup is enabled, which fails this check.
#   gh api -X PATCH repos/combsmith/.github/code-scanning/default-setup \
#     -f state=not-configured
#
# The required-check context produced here is `CodeQL` — do NOT rename the
# `CodeQL` job; the ruleset matches the required check by context name.
# ─────────────────────────────────────────────────────────────────────────────
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required status check: must report on the merge queue's gh-readonly-queue/*
  # ref, or the queue never merges.
  merge_group:
  # Default setup scanned weekly even when nothing changed, which is how newly
  # published queries reach code nobody has touched. Keep that. Minute chosen by
  # scripts/lib/cron-timing.sh (cron_offset_minute codeql.yml).
  schedule:
    - cron: '22 4 * * 0'   # Sundays 04:22 UTC

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Preserve the language set from the prior default setup.
        language: [actions, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: ${{ matrix.language }}
          # `actions` and `python` are interpreted — no compilation step.
          build-mode: none
          # No `queries:` input: the `default` suite, as default setup ran.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          category: /language:${{ matrix.language }}
          # Upload after the filter below. `failure-only` still sends a failed
          # run's debugging data, as GitHub advises when post-processing SARIF.
          upload: failure-only
          output: ${{ runner.temp }}/codeql-sarif
      # The org pins its own reusable workflows to moving channel tags on purpose
      # (standards/ci-standards.md, "Exception: Internal Reusable Workflow
      # References"). Drop `actions/unpinned-tag` results on `combsmith/` refs
      # only; third-party tag pins and every other result are kept (Maintainer,
      # 2026-11-24). That query is in security-extended, not the default suite
      # this file runs, so today this step drops nothing here; it keeps the two
      # repos' CodeQL alike. A SARIF the script cannot read fails this step, so
      # nothing is uploaded and the CodeQL check goes red.
      - name: Drop unpinned-tag results on org refs
        env:
          ORG: combsmith
          SARIF_IN: ${{ runner.temp }}/codeql-sarif/${{ matrix.language }}.sarif
          SARIF_OUT: ${{ runner.temp }}/codeql-sarif-filtered/${{ matrix.language }}.sarif
        run: bash scripts/codeql-filter-org-pins.sh "$SARIF_IN" "$SARIF_OUT" "$GITHUB_WORKSPACE"
      # Checked here, in the workflow, so that an edit to the script alone cannot
      # hide a result: everything outside the results is unchanged, no result is
      # added, every result of another rule is unchanged, and each unpinned-tag
      # result that went missing names a `combsmith/` ref in its closing clause.
      - name: Check that only org-ref unpinned-tag results were dropped
        env:
          SARIF_IN: ${{ runner.temp }}/codeql-sarif/${{ matrix.language }}.sarif
          SARIF_OUT: ${{ runner.temp }}/codeql-sarif-filtered/${{ matrix.language }}.sarif
        run: |
          jq -e --slurpfile out "$SARIF_OUT" '
            def rule: .ruleId // .rule.id // "";
            def tag: "actions/unpinned-tag";
            def others: [.runs[] | (.results // [])[] | select(rule != tag)];
            def tags: [.runs[] | (.results // [])[] | select(rule == tag)];
            def org_ref: (.message.text // "")
              | test("(\\]\\([0-9]+\\) uses|\u0027 uses reusable workflow) \u0027combsmith/[^\u0027\\s]+\u0027 with ref \u0027[^\u0027]*\u0027, not a pinned commit hash$"; "i");
            $out[0] as $o
            | (del(.runs[].results) == ($o | del(.runs[].results)))
              and (others == ($o | others))
              and (($o | tags) - tags == [])
              and ((tags - ($o | tags)) | length) == ((tags | length) - ($o | tags | length))
              and ((tags - ($o | tags)) | all(org_ref))' "$SARIF_IN" > /dev/null
      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif-filtered/${{ matrix.language }}.sarif
          category: /language:${{ matrix.language }}

  CodeQL:
    name: CodeQL
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fail closed: only a fully successful matrix passes. `cancelled` and
      # `skipped` runs completed no scan, so they must not report green.
      - name: Require every language analysis to succeed
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "${ANALYZE_RESULT}" != "success" ]]; then
            echo "CodeQL analyze result: ${ANALYZE_RESULT} (expected success)" >&2
            exit 1
          fi

# Quality gates for the Dependabot automerge / update-and-merge reusables and
# their merge / approval gate scripts (issues #1399, #1400).
#
# Triggered on any PR that touches:
#   - .github/workflows/dependabot-*.yml
#   - .github/scripts/dependabot/**
#   - test/workflows/dependabot/**
#   - standards/workflows/dependabot-*.yml
#
# Gates (all must pass before merge):
#   1. shellcheck — static analysis for the gate libs
#   2. bats       — unit tests for the pure gates + end-to-end tests of the
#                   reusables' approve / merge run-blocks against a stubbed gh
#
# Contract: .github/scripts/dependabot/README.md

name: Dependabot Gate Tests

on:
  pull_request:
    paths:
      - '.github/workflows/dependabot-*.yml'
      - '.github/scripts/dependabot/**'
      - 'test/workflows/dependabot/**'
      - 'standards/workflows/dependabot-*.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dependabot-*.yml'
      - '.github/scripts/dependabot/**'
      - 'test/workflows/dependabot/**'
      - 'standards/workflows/dependabot-*.yml'

permissions:
  contents: read

concurrency:
  group: dependabot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install bats, shellcheck, and jq (yq is preinstalled on the runner)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats shellcheck jq

      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck -x \
            .github/scripts/dependabot/lib/gates.sh \
            .github/scripts/dependabot/lib/gh-io.sh

      - name: Run bats suite
        run: bats --print-output-on-failure test/workflows/dependabot/

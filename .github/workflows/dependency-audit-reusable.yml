# Reusable dependency vulnerability audit — single source of truth for the org.
# Repo-level dependency-audit.yml files call this to avoid duplicating the
# multi-ecosystem detection and audit logic.
# Standard: https://github.com/combsmith/.github/blob/main/standards/ci-standards.md#5-dependency-audit-dependency-auditym
#
# Auto-detects ecosystems present in the repository and runs the appropriate
# audit tool. Fails the build if any dependency has a known security advisory.
# The `Audit gate` job is the aggregate result of detection plus every audit.
#
# Cargo/Python discovery and the gate verdict live in
# .github/scripts/dependency-audit/lib/dependency-audit.sh (bats-tested in
# test/workflows/dependency-audit/); the jobs check this repo out at the
# reusable's own commit and source it.
#
# Pinned tool versions (update deliberately):
#   govulncheck v1.1.4 | cargo-audit 0.22.1 | pip-audit 2.9.0
#   Python 3.13 for pip-audit (`python-version` input). Never a floating "3.x":
#   a new Python release can break the hash-locked tooling for every caller at
#   once (3.15 removed sre_constants, crashing pip-api 0.0.34's vendored
#   pyparsing).
name: Dependency audit (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python minor the pip-audit tooling runs on (pinned; never a floating 3.x)"
        required: false
        type: string
        default: "3.13"

permissions:
  contents: read

jobs:
  detect:
    name: Detect ecosystems
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.check.outputs.npm }}
      pnpm: ${{ steps.check.outputs.pnpm }}
      gomod: ${{ steps.check.outputs.gomod }}
      cargo: ${{ steps.check.outputs.cargo }}
      pip: ${{ steps.check.outputs.pip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect package ecosystems
        id: check
        run: |
          # npm — look for package-lock.json anywhere (excluding node_modules)
          if find . -name 'package-lock.json' -not -path '*/node_modules/*' | grep -q .; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
          fi

          # pnpm — look for pnpm-lock.yaml anywhere
          if find . -name 'pnpm-lock.yaml' -not -path '*/node_modules/*' | grep -q .; then
            echo "pnpm=true" >> "$GITHUB_OUTPUT"
          else
            echo "pnpm=false" >> "$GITHUB_OUTPUT"
          fi

          # Go modules — detect via go.mod (not go.sum, which may not exist)
          if find . -name 'go.mod' -not -path '*/vendor/*' | grep -q .; then
            echo "gomod=true" >> "$GITHUB_OUTPUT"
          else
            echo "gomod=false" >> "$GITHUB_OUTPUT"
          fi

          # Cargo — detect via Cargo.toml anywhere (lockfile may not exist for libraries)
          if find . -name 'Cargo.toml' -not -path '*/target/*' | grep -q .; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
          fi

          # Python — detect pyproject.toml or requirements.txt anywhere
          if find . -name 'pyproject.toml' -not -path '*/.venv/*' -not -path '*/venv/*' | grep -q . || \
             find . -name 'requirements.txt' -not -path '*/.venv/*' -not -path '*/venv/*' | grep -q .; then
            echo "pip=true" >> "$GITHUB_OUTPUT"
          else
            echo "pip=false" >> "$GITHUB_OUTPUT"
          fi

  audit-npm:
    name: npm audit
    needs: detect
    if: needs.detect.outputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Audit npm dependencies
        run: |
          # Audit each package-lock.json found in the repo
          status=0
          while IFS= read -r dir; do
            echo "::group::npm audit $dir"
            if ! (cd "$dir" && npm audit --audit-level=low); then
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -name 'package-lock.json' -not -path '*/node_modules/*' -exec dirname {} \;)
          exit $status

  audit-pnpm:
    name: pnpm audit
    needs: detect
    if: needs.detect.outputs.pnpm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Audit pnpm dependencies
        run: |
          # Audit each pnpm-lock.yaml found in the repo
          status=0
          while IFS= read -r dir; do
            echo "::group::pnpm audit $dir"
            if ! (cd "$dir" && pnpm audit --audit-level low); then
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -name 'pnpm-lock.yaml' -not -path '*/node_modules/*' -exec dirname {} \;)
          exit $status

  audit-go:
    name: govulncheck
    needs: detect
    if: needs.detect.outputs.gomod == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: "stable"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4  # NOSONAR(githubactions:S8545) pinned @vX.Y.Z is reproducible (verified via Go checksum DB); no --locked equivalent

      - name: Audit Go dependencies
        run: |
          status=0
          while IFS= read -r dir; do
            echo "::group::govulncheck $dir"
            if ! (cd "$dir" && govulncheck ./...); then
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -name 'go.mod' -not -path '*/vendor/*' -exec dirname {} \;)
          exit $status

  audit-cargo:
    name: cargo audit
    needs: detect
    if: needs.detect.outputs.cargo == 'true'
    runs-on: ubuntu-latest
    steps:
      # The audited repo goes in `repo/` so the tooling checkout below is never
      # part of the tree being scanned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      # Discovery/coverage logic lives in .github/scripts/dependency-audit/
      # (bats-tested). Source it from THIS reusable's own commit so it always
      # matches the channel the caller pinned. `job.workflow_sha`, not
      # `github.job_workflow_sha`, which is empty at step level (#839).
      - name: Check out dependency-audit tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: combsmith/.github
          ref: ${{ job.workflow_sha }}
          path: .dependency-audit-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo install cargo-audit@0.22.1 --locked

      - name: Audit Cargo dependencies
        working-directory: repo
        run: |
          # One audit per workspace root that covers a Cargo.toml, as reported
          # by `cargo metadata` (a crate the parent workspace excludes is its own
          # root and is audited on its own, #1393). A committed Cargo.lock is
          # audited as committed; one is generated only when none exists (#1394).
          # shellcheck source=/dev/null
          . ../.dependency-audit-tooling/.github/scripts/dependency-audit/lib/dependency-audit.sh
          dep_audit_cargo_run .

  audit-pip:
    name: pip-audit
    needs: detect
    if: needs.detect.outputs.pip == 'true'
    runs-on: ubuntu-latest
    steps:
      # The audited repo goes in `repo/` so the tooling checkout below is never
      # part of the tree being scanned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false

      # Same tooling source as audit-cargo. It also carries the hash-locked
      # pip-audit requirements, which the audited repo does not have.
      - name: Check out dependency-audit tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: combsmith/.github
          ref: ${{ job.workflow_sha }}
          path: .dependency-audit-tooling
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install pip-audit
        run: 'pip install --require-hashes --only-binary :all: -r .dependency-audit-tooling/scripts/pip-audit-requirements.txt'

      - name: Audit Python dependencies
        working-directory: repo
        run: |
          # Audit each Python project found in the repo. Some projects ship
          # both pyproject.toml (tooling/build) and requirements.txt (pinned
          # runtime deps) — audit BOTH when both are present rather than
          # short-circuiting on pyproject.toml. Discovery is NUL-delimited and
          # a discovered project that cannot be audited fails the job (#1404).
          # shellcheck source=/dev/null
          . ../.dependency-audit-tooling/.github/scripts/dependency-audit/lib/dependency-audit.sh
          dep_audit_python_run .

  # Aggregate result of the whole audit (#1406). `Detect ecosystems` succeeds
  # as soon as discovery finishes, whatever the scanners find; this job fails
  # when detection or any scanner failed or was cancelled (a scanner skipped
  # because its ecosystem is absent is fine). `always()` — not `!cancelled()` —
  # so a cancelled run reports a failure here instead of a skip. Every audit-*
  # job MUST be listed in `needs` (pinned by test/workflows/dependency-audit/).
  audit-gate:
    name: Audit gate
    needs: [detect, audit-npm, audit-pnpm, audit-go, audit-cargo, audit-pip]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out dependency-audit tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: combsmith/.github
          ref: ${{ job.workflow_sha }}
          path: .dependency-audit-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Require every audit to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # shellcheck source=/dev/null
          . .dependency-audit-tooling/.github/scripts/dependency-audit/lib/dependency-audit.sh
          printf '%s' "$NEEDS_JSON" | dep_audit_gate_verdict

# Reusable Dependabot auto-merge workflow — single source of truth for the org.
# Repo-level dependabot-automerge.yml files call this to avoid duplicating
# eligibility logic and the GitHub App token dance.
# Standard: https://github.com/combsmith/.github/blob/main/standards/dependabot-policy.md
#
# Auto-approves and enables auto-merge for Dependabot PRs that are:
#   - GitHub Actions updates (any version bump, including major)
#   - Security updates for any ecosystem (patch or minor)
#   - Indirect (transitive) dependency updates
# Major version updates for non-Actions ecosystems are left for human review.
# Uses --auto so the merge waits for all required CI checks to pass.
#
# Safety model: application ecosystems use open-pull-requests-limit: 0 in
# dependabot.yml, so the only app-ecosystem PRs Dependabot can create are
# security updates. This workflow adds defense-in-depth by also checking
# the package ecosystem.
#
# Provenance gate (issue #1400): Dependabot metadata describes only the
# Dependabot commit, so before approving, every commit on the PR must be from
# Dependabot (or a branch update made by this App via update-branch) and the
# head must still be the commit this event was for. The approval and the
# auto-merge request are bound to that head SHA. If a later commit fails the
# gate, auto-merge is disabled and this App's earlier approvals are dismissed.
# Decision logic lives in .github/scripts/dependabot/lib/ (bats-tested).
#
# Required org/repo secrets (passed via `secrets: inherit` from caller):
#   APP_ID         — GitHub App ID with contents:write and pull-requests:write
#   APP_PRIVATE_KEY — GitHub App private key
name: Dependabot auto-merge (Reusable)

on:
  workflow_call:
    secrets:
      APP_ID:
        description: "GitHub App ID with contents:write and pull-requests:write"
        required: true
      APP_PRIVATE_KEY:
        description: "GitHub App private key"
        required: true

permissions: {}  # no default permissions; each job grants only what it needs

jobs:
  dependabot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          skip-commit-verification: true

      - name: Determine if auto-merge eligible
        id: eligible
        run: |
          UPDATE_TYPE="${{ steps.metadata.outputs.update-type }}"
          DEP_TYPE="${{ steps.metadata.outputs.dependency-type }}"
          ECOSYSTEM="${{ steps.metadata.outputs.package-ecosystem }}"

          # GitHub Actions are SHA-pinned and don't affect app runtime,
          # so all version bumps (including major) are eligible.
          # App ecosystem PRs can only exist as security updates (limit: 0)
          # and must be patch/minor/indirect — major requires human review.
          if [[ "$ECOSYSTEM" != "github_actions" && \
                "$UPDATE_TYPE" != "version-update:semver-patch" && \
                "$UPDATE_TYPE" != "version-update:semver-minor" && \
                "$DEP_TYPE" != "indirect" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: major update for $ECOSYSTEM requires human review"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "Auto-merge eligible: ecosystem=$ECOSYSTEM update=$UPDATE_TYPE"

      - name: Check app secrets
        if: steps.eligible.outputs.eligible == 'true'
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          if [[ -z "$APP_ID" ]]; then
            echo "::error::APP_ID secret is missing. Set APP_ID and APP_PRIVATE_KEY in org secrets. See standards/dependabot-policy.md"
            exit 1
          fi

      - name: Generate app token
        if: steps.eligible.outputs.eligible == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Dependabot gate tooling
        if: steps.eligible.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: combsmith/.github
          # This reusable's own commit, so the gate scripts always match the
          # channel the caller pinned (same pattern as feature-ideation, #839).
          ref: ${{ job.workflow_sha }}
          path: .dependabot-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Approve and enable auto-merge
        if: steps.eligible.outputs.eligible == 'true'
        run: |
          # shellcheck source=/dev/null
          . .dependabot-tooling/.github/scripts/dependabot/lib/gates.sh
          # shellcheck source=/dev/null
          . .dependabot-tooling/.github/scripts/dependabot/lib/gh-io.sh

          APP_LOGIN="${APP_SLUG:+${APP_SLUG}[bot]}"

          # Reads use the job's GITHUB_TOKEN; only the writes use the App token.
          rc=0
          GH_TOKEN="$READ_TOKEN" dependabot_provenance_check "$REPO" "$PR_NUMBER" "$APP_LOGIN" "$EVENT_HEAD_SHA" || rc=$?
          if [[ "$rc" -eq 2 ]]; then
            echo "::error::Not approving PR #$PR_NUMBER — $DEPENDABOT_GATE_REASON"
            exit 1
          fi
          if [[ "$rc" -ne 0 ]]; then
            if [[ "$DEPENDABOT_GATE_STALE" == "true" ]]; then
              # A newer push superseded this event; its own run decides.
              echo "Not approving PR #$PR_NUMBER — $DEPENDABOT_GATE_REASON"
              exit 0
            fi
            # Commits on the PR that did not come from Dependabot: withdraw any
            # earlier automated approval / auto-merge and leave it to a human.
            echo "::warning::Not approving PR #$PR_NUMBER — $DEPENDABOT_GATE_REASON"
            dependabot_revoke_automation "$REPO" "$PR_NUMBER" "$APP_LOGIN" "$DEPENDABOT_GATE_REASON"
            exit 0
          fi

          echo "Provenance gate passed ($DEPENDABOT_GATE_REASON) — approving $DEPENDABOT_GATE_SHA"
          dependabot_approve_and_automerge "$REPO" "$PR_NUMBER" "$DEPENDABOT_GATE_SHA"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

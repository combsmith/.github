# Quality gates for the compliance-audit script, its unit tests and the audit
# workflow's fleet-pause gate.
#
# Triggered on any PR that touches:
#   - scripts/compliance-audit.sh
#   - test/scripts/compliance-audit/**
#   - .github/workflows/compliance-audit-and-improvement.yml
#   - test/workflows/compliance-audit/**
#   - test/workflows/helpers/**
#
# Gates (all must pass before merge):
#   1. shellcheck — static analysis for the audit script
#   2. bats       — unit tests for its pure helpers (pin matching, ruleset
#                   targeting, codeowners catch-all, …) and for the health
#                   survey's alert counts (scripts/lib/health-alerts.sh)
#   3. bats       — AGENTS_PAUSED gate of compliance-audit-and-improvement.yml
#                   (#1309; needs PyYAML and fails without it)

name: Compliance Audit Tests

on:
  pull_request:
    paths:
      - 'scripts/compliance-audit.sh'
      - 'scripts/lib/**'
      - 'test/scripts/compliance-audit/**'
      - '.github/workflows/compliance-audit-and-improvement.yml'
      - 'test/workflows/compliance-audit/**'
      - 'test/workflows/helpers/**'
      - '.github/workflows/compliance-audit-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/compliance-audit.sh'
      - 'scripts/lib/**'
      - 'test/scripts/compliance-audit/**'
      - '.github/workflows/compliance-audit-and-improvement.yml'
      - 'test/workflows/compliance-audit/**'
      - 'test/workflows/helpers/**'
      - '.github/workflows/compliance-audit-tests.yml'

permissions:
  contents: read

concurrency:
  group: compliance-audit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install bats, shellcheck, and jq
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats shellcheck jq

      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --severity=warning -x scripts/compliance-audit.sh scripts/lib/health-alerts.sh

      - name: Install PyYAML for the fleet-pause suite
        run: 'pip install --quiet --require-hashes --only-binary :all: -r scripts/feature-ideation-tests-requirements.txt'

      - name: Run bats suite
        run: bats --print-output-on-failure test/scripts/compliance-audit/

      - name: Run workflow fleet-pause suite
        run: bats --print-output-on-failure test/workflows/compliance-audit/

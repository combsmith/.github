# SonarCloud code quality, maintainability, and security hotspot scanning.
# Standard: https://github.com/petry-projects/.github/blob/main/standards/ci-standards.md#3-sonarcloud-analysis-sonarcloudyml
name: SonarCloud Analysis

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pytest and dependencies
        run: 'pip install --quiet --require-hashes --only-binary :all: -r scripts/pytest-requirements.txt'

      - name: Generate coverage report
        run: |
          set -euo pipefail
          python3 -m pytest test/feature-ideation/test_validate_signals.py \
            --cov --cov-report=xml:test/feature-ideation/coverage.xml

      # First attempt. continue-on-error lets the retry step below recover from
      # transient 403/5xx responses from binaries.sonarsource.com (the scanner
      # CLI download), without failing the job on a single CDN blip.
      - name: SonarCloud Scan
        id: sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        continue-on-error: true
      - name: SonarCloud Scan (retry)
        if: ${{ env.SONAR_TOKEN != '' && steps.sonar.outcome == 'failure' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

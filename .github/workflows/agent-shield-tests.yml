# Quality gates for the AgentShield reusable and its severity gate (issue #1436).
name: AgentShield Gate Tests

on:
  pull_request:
    paths:
      - '.github/workflows/agent-shield-*.yml'
      - '.github/scripts/agent-shield/**'
      - 'test/workflows/agent-shield/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/agent-shield-*.yml'
      - '.github/scripts/agent-shield/**'
      - 'test/workflows/agent-shield/**'

permissions:
  contents: read

concurrency:
  group: agent-shield-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install bats, shellcheck, and jq (yq is preinstalled on the runner)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats shellcheck jq

      - name: shellcheck
        run: shellcheck -x .github/scripts/agent-shield/lib/severity-gate.sh

      - name: Run bats suite
        run: bats --print-output-on-failure test/workflows/agent-shield/

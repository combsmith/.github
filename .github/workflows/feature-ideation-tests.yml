# Quality gates for the reusable feature-ideation workflow and its
# supporting scripts.
#
# Triggered on any PR that touches:
#   - .github/workflows/feature-ideation*.yml
#   - .github/scripts/feature-ideation/**
#   - .github/schemas/signals.schema.json
#   - test/workflows/feature-ideation/**
#   - test/workflows/helpers/**   (fleet-pause.bash, loaded by fleet-pause.bats)
#   - standards/workflows/feature-ideation.yml
#
# Gates (all must pass before merge):
#   1. shellcheck   — static analysis for every script in the suite
#   2. lint-prompt  — direct prompt blocks have no unescaped shell expansions
#   3. schema check — fixtures validate against signals.schema.json
#   4. bats         — full unit + integration test suite (~92 tests)
#
# Standard: this workflow enforces the contract documented in
# .github/scripts/feature-ideation/README.md.

name: Feature Ideation Tests

on:
  pull_request:
    paths:
      - '.github/workflows/feature-ideation*.yml'
      - '.github/scripts/feature-ideation/**'
      - '.github/schemas/signals.schema.json'
      - 'test/workflows/feature-ideation/**'
      - 'test/workflows/helpers/**'
      - 'standards/workflows/feature-ideation.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/feature-ideation*.yml'
      - '.github/scripts/feature-ideation/**'
      - '.github/schemas/signals.schema.json'
      - 'test/workflows/feature-ideation/**'
      - 'test/workflows/helpers/**'
      - 'standards/workflows/feature-ideation.yml'

permissions:
  contents: read

concurrency:
  group: feature-ideation-tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, schema, and bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install bats, shellcheck, jq, and yq
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats shellcheck jq
          # Install a pinned mikefarah/yq so the suite is reproducible and not
          # dependent on whatever version ships in the runner image.
          YQ_VERSION="v4.44.3"
          # --proto '=https' --proto-redir '=https' enforces HTTPS on both the
          # initial request and any redirects (GitHub releases redirect to
          # objects.githubusercontent.com).
          # --retry 5 --retry-delay 2 --retry-connrefused --retry-all-errors
          # rides out the transient network/5xx blips from that redirect target
          # that otherwise flake this suite (#739); --connect-timeout/--max-time
          # bound each attempt so a stalled connection cannot eat the job budget.
          curl -sSfL --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 \
            --retry 5 --retry-delay 2 --retry-connrefused --retry-all-errors \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq_linux_amd64
          # SHA-256 of yq_linux_amd64 for v4.44.3, hardcoded (vetted) rather than
          # fetched from the same release, so a swapped release asset is detected.
          # Update together with YQ_VERSION.
          YQ_SHA256="a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7"
          echo "${YQ_SHA256}  /tmp/yq_linux_amd64" | sha256sum -c -
          sudo install -m 755 /tmp/yq_linux_amd64 /usr/local/bin/yq

      - name: Install Python jsonschema and PyYAML
        run: 'pip install --quiet --require-hashes --only-binary :all: -r scripts/feature-ideation-tests-requirements.txt'

      - name: Install pytest for Python unit tests
        run: 'pip install --quiet --require-hashes --only-binary :all: -r scripts/pytest-requirements.txt'

      - name: shellcheck
        run: |
          set -euo pipefail
          cd .github/scripts/feature-ideation
          shellcheck -x \
            collect-signals.sh \
            lint-prompt.sh \
            lint-caller.sh \
            match-discussions.sh \
            discussion-mutations.sh \
            lib/gh-safe.sh \
            lib/filter-bots.sh \
            lib/compose-signals.sh \
            lib/date-utils.sh

      - name: Lint direct prompt blocks
        run: bash .github/scripts/feature-ideation/lint-prompt.sh

      - name: "Lint caller stubs for the #571 inputs-context startup failure"
        run: bash .github/scripts/feature-ideation/lint-caller.sh

      - name: Validate schema fixtures
        run: |
          set -euo pipefail
          for fixture in test/workflows/feature-ideation/fixtures/expected/*.signals.json; do
            base=$(basename "$fixture")
            if [[ "$base" == INVALID-* ]]; then
              if python3 .github/scripts/feature-ideation/validate-signals.py \
                   "$fixture" .github/schemas/signals.schema.json; then
                echo "::error file=$fixture::expected validation failure but it passed"
                exit 1
              fi
            else
              python3 .github/scripts/feature-ideation/validate-signals.py \
                "$fixture" .github/schemas/signals.schema.json
            fi
          done

      - name: Run Python unit tests
        run: |
          set -euo pipefail
          python3 -m pytest test/feature-ideation/test_validate_signals.py -v \
            --cov --cov-report=xml:test/feature-ideation/coverage.xml

      - name: Run bats suite
        run: bats --print-output-on-failure test/workflows/feature-ideation/

      - name: Upload bats output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bats-output
          path: |
            test/workflows/feature-ideation/**/*.log
          if-no-files-found: ignore
          retention-days: 7

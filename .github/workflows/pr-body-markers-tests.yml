# Tests for the pull request body marker check (scripts/lib/pr-body-markers.sh,
# scripts/check-pr-body-markers.sh; issue #1571). Gates: shellcheck + bats.
name: PR Body Markers Tests

on:
  pull_request:
    paths:
      - 'scripts/lib/pr-body-markers.sh'
      - 'scripts/check-pr-body-markers.sh'
      - 'test/scripts/pr-body-markers/**'
      - '.github/workflows/pr-body-markers.yml'
      - '.github/workflows/pr-body-markers-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lib/pr-body-markers.sh'
      - 'scripts/check-pr-body-markers.sh'
      - 'test/scripts/pr-body-markers/**'
      - '.github/workflows/pr-body-markers.yml'
      - '.github/workflows/pr-body-markers-tests.yml'

permissions: {}

concurrency:
  group: pr-body-markers-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats, shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats shellcheck

      - name: shellcheck
        run: shellcheck --severity=warning -x scripts/lib/pr-body-markers.sh scripts/check-pr-body-markers.sh

      - name: bats
        run: bats --print-output-on-failure test/scripts/pr-body-markers/
